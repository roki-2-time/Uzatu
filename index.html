<!DOCTYPE html>
<html lang="kk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ақдана - Қыз ұзату тойына шақыру</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FAF4E5',
                            200: '#F3E5AB',
                            300: '#E6C687',
                            400: '#DCB35D',
                            500: '#D4AF37',
                            600: '#C59B27',
                            700: '#A67C1E',
                            800: '#8A6B12'
                        },
                        cream: {
                            100: '#FFFDF9',
                            200: '#FDF6E2',
                            300: '#FAF0CA',
                            400: '#F5E6C8'
                        },
                        blush: {
                            50: '#FFF7F8',
                            100: '#FDE8EB',
                            200: '#FACCD4',
                            300: '#F7A1B2',
                            400: '#F0758F'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        title: ['"Cinzel Decorative"', 'serif'],
                        playfair: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FCFBF7;
            color: #333333;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(253, 232, 235, 0.4) 0%, rgba(252, 251, 247, 0.95) 75%);
        }

        /* Cream Color for Akdana Name */
        .cream-name-text {
            color: #FAF0CA;
            text-shadow: 
                0 0 1px #D4AF37,
                2px 2px 8px rgba(138, 107, 18, 0.6),
                -1px -1px 0 rgba(212, 175, 55, 0.4);
        }

        /* Gold Gradient Text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #A67C1E 0%, #D4AF37 30%, #FBF5B7 50%, #D4AF37 70%, #8A6B12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #AA771C 100%);
        }

        /* Luxury Card with blur */
        .luxury-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 15px 35px -5px rgba(226, 185, 195, 0.35);
        }

        /* Repeating Kazakh Ornament Background Pattern */
        .ornament-bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0 C45 15, 65 15, 65 30 C65 40, 50 45, 40 60 C30 45, 15 40, 15 30 C15 15, 35 15, 40 0 Z M40 80 C45 65, 65 65, 65 50 C65 40, 50 35, 40 20 C30 35, 15 40, 15 50 C15 65, 35 65, 40 80 Z' fill='%23d4af37' fill-opacity='0.05'/%3E%3C/svg%3E");
        }

        /* Petal Canvas overlay */
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        /* Scroll Reveal Animation */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 0 14px rgba(212, 175, 55, 0); }
        }

        .audio-btn-pulse {
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .float-anim {
            animation: floatSlow 6s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FCFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #E6C687;
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative text-gray-800 antialiased selection:bg-blush-200 selection:text-gold-800 ornament-bg-pattern">

    <!-- Interactive Petal Animation Overlay -->
    <canvas id="petalCanvas"></canvas>

    <div class="fixed top-5 right-5 z-50">
        <button id="musicToggleBtn" onclick="toggleAudio()" class="audio-btn-pulse flex items-center gap-2.5 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-full border border-gold-400 shadow-xl text-gold-700 hover:text-gold-900 transition-all transform hover:scale-105 active:scale-95">
            <i id="musicIcon" class="fa-solid fa-music text-lg"></i>
            <span id="musicText" class="text-xs font-semibold uppercase tracking-wider hidden sm:inline">Әлқисса күйі</span>
        </button>
    </div>

    <!-- Фоновая музыка «Әлқисса».
         Файл alkissa.mp3 должен лежать в той же папке, что и index.html (имя — строчными буквами) -->
    <audio id="alkissaAudio" preload="auto" loop playsinline>
        <source src="alkissa.mp3" type="audio/mpeg">
    </audio>

                <path d="M20 20 C40 5, 80 5, 90 30 C100 55, 70 70, 50 50 C30 30, 10 60, 20 80" stroke="#D4AF37" stroke-width="4" fill="none"/>

        <div class="max-w-2xl w-full text-center relative z-10 my-auto pt-4">
            
            <!-- Kazakh Yurt Vector Illustration -->

                <div class="relative w-36 h-28 sm:w-44 sm:h-36 mx-auto">
                    <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" class="w-full h-full filter drop-shadow-md">

                    </svg>
                </div>
            </div>

            <!-- Invitation Subtitle -->
            <p class="reveal active text-xs sm:text-sm font-semibold tracking-[0.35em] uppercase text-gold-700 mb-1">
                Шақыру билеті
            </p>

            <h2 class="reveal active font-serif text-2xl sm:text-3xl md:text-4xl italic text-gray-700 mb-3 font-medium">
                Қыз Ұзату Тойы

            <div class="reveal active my-6 relative py-3">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="w-64 h-64 sm:w-80 sm:h-80 rounded-full bg-gold-200/40 blur-3xl -z-10"></div>

                <div class="inline-block relative px-8 py-3 bg-gold-700/80 rounded-3xl backdrop-blur-md border-2 border-gold-400 shadow-2xl">

                        Ақдана

                    </div>
